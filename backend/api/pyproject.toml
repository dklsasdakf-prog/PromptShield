[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkred-ai-security-api"
version = "0.1.0"
description = "Checkred AI Security Phase 1 backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]==0.115.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.8.2",
    "PyJWT[crypto]==2.10.1",
    "sqlalchemy>=2.0.36",
    "alembic==1.13.2",
    "psycopg[binary]>=3.2.2",
    "opensearch-py==2.5.0",
    "pynacl==1.5.0",
    "python-dateutil==2.9.0.post0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "testcontainers>=4.7.1"
]

[project.scripts]
checkred-api = "backend.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend", "backend.*"]
